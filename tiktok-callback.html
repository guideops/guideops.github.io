<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Connecting TikTok…</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:20vh auto;padding:0 20px;color:#1a2233;text-align:center}</style></head>
<body>
<p>Handing the TikTok authorization back to your local Guidant Studio…</p>
<script>
  // TikTok requires an https redirect URI on a verified domain; Guidant runs on
  // localhost. This page just forwards the OAuth response to the local server.
  window.location.replace('http://localhost:3000/api/connect/tiktok/callback' + window.location.search);
</script>
<p>If nothing happens, make sure Guidant Studio is running on <code>localhost:3000</code>, then reload this page.</p>
</body></html>
